<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up Form</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#2f2f2f;
    font-family: Arial, sans-serif;
}

.container{
    width:1000px;
    height:590px;
    display:flex;
    background:#3b3b3b;
}

.left{
    width:50%;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:left;
    text-align:left;
}

.left h1{
    margin:0;
    font-size:36px;
}

.left p{
    font-size:14px;
    margin-top:10px;
}

.right{
    width:30%;
    padding:50px;
    background:#4a4a4a;
    color:white;
}

.right h2{
    text-align:left;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:10px;
    font-size:13px;
    color:#ddd;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:4px;
    background:transparent;
    border:2px solid #aaa;   
    color:white;
    outline:none;
}

button{
    width:100%;
    padding:10px;
    margin-top:15px;
    background:#666;
    border:none;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#777;
}

small{
    display:block;
    text-align:left;
    margin-top:10px;
    color:#ccc;
}
</style>
</head>

<body>

<div class="container">
    <div class="left">
        <h1>facebook</h1>
        <p>Connect with friends and the world around you.</p>
    </div>

    <div class="right">
        <h2>Sign Up</h2>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Create a password">

        <label>Gender</label>
        <select>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Phone Number</label>
        <input type="text" placeholder="Enter your phone number">

        <label>Address</label>
        <input type="text" placeholder="Enter your address">

        <button>Sign Up</button>
        <small>Already have an account? Log in</small>
    </div>
</div>

<script>
let inputs = document.querySelectorAll("input");

inputs.forEach(input => {
    input.addEventListener("focus", function(){
        this.style.borderColor = "yellow";   
    });

    input.addEventListener("blur", function(){
        this.style.borderColor = "#aaa"; 
    });
});
</script>
</body>
</html>
