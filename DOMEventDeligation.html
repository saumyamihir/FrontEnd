    <!-- Create an interactive To-Do list -->
    <!-- When u click on any list item
      the background color and the color of text
      should be changed. -->
    <!-- When you double click on any item
     that item should be removedfrom the list -->
    <!--Also Identify the parent element and next element 
    sibling of that item which is clicked -->
    <!-- After the list , display the total count of the items Dynamically -->
      
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button id="addTaskBtn">Add Task</button>
    <ul id="taskList"></ul>
    <script>
        let taskInput = document.getElementById('taskInput');
        let addTaskBtn = document.getElementById('addTaskBtn');
        let taskList = document.getElementById('taskList');

        addTaskBtn.addEventListener('click', () => {
            let taskText = taskInput.value.trim();
            if (taskText !== '') {
                let listItem = document.createElement('li');
                listItem.textContent = taskText;
                taskList.appendChild(listItem);
                taskInput.value = '';
            }
        });
    </script>



</body>
