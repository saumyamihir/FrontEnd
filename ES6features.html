<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // Destructuring of an Array
        let arr1 =[1,3,4,6];
        const [a,b,c,d] = arr1;
        console.log(a,b,d);
        console.log(c);

        let arr2 = ["a","b","c"];
        const [x,y,z ,g=40] = arr2; // Assuring default value during destructuring
        console.log(x,y,z,g);

        
        
        
        // Object destructuring
        let laptop = {
            brand:"Lenovo",
            color:"Silver",
            price:"90K"
        }
        const {brand, price, color} = laptop; // Original Variable name 
        const {brand:laptopbrand, price:p, ss="13 inch"} = laptop; // Renaming of Variable name
        console.log(laptopbrand);
        console.log(color);
        console.log(p);
        console.log(ss);




        // Spread Operator :
        let a1 = [10,2,4];
        let a2 = [...a1,"e","p"];
        console.log(a2);


        // create an array c copy into another array using spread operator push 90 to new Array .
        let a3  = [...a1,90] ;
        console.log(a3);

        // Usage of Spread Operator in Function Call 
        function sumAdd(a,b,c)
        {
            return a+b+c;
        }
        // console.log(1,2,3);
        let arrnew = [1,2,3,4];
        console.log(sumAdd(...arrnew));

        let person = {name:"Sami",age:21};
        let student ={...person,grade:"A",rollno:30};
        console.log(student);    
        
        



        // Rest Operator

        function newfunc(...numbers)
        {
          // return numbers.map(n=>n*2) // map fun will make multiple of each element.
          return numbers.reduce((a,n)=>a+n,0); // reduce fun will make sum of each elememnt of array.
        }
        console.log(newfunc(1,3,4,5,6,7));

        // Destructuring with  Rest Operator

        let stu = {name:"Sami", age:21,rollno:32};
        const {name,...others} = stu;
        console.log(name);
        console.log(others);


        

    </script>
</body>
</html>
