    <h1 id="status">Click button to place order</h1>
    <button id="orderBtn">Place Order</button>

    <script>
        let statusText = document.getElementById("status");
        let button = document.getElementById("orderBtn");

        button.addEventListener("click", () => {
            updateStatus("Order Placed", 0)
            .then(() => updateStatus("Order Preparing", 3000))
            .then(() => updateStatus("Order Packed", 5000))
            .then(() => updateStatus("Order Out for Delivery", 7000))
            .then(() => updateStatus("Order Delivered", 10000))
            .catch((err) => console.log(err));
        });

        function updateStatus(message,time) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    statusText.innerText = message;
                    resolve();
                }, time);
            });
        }
    </script>
